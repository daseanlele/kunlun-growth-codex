[package]
name = "kunlun-growth-codex"
version = "0.2.0"
description = "昆仑增长企业 AI 桌面工作台"
authors = ["Kunlun Growth Contributors"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kunlun_growth_codex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
thiserror = "2"
tracing = "0.1"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
